[project]
name = "brain"
version = "0.1.0"
description = "Company Brain backend: ingestion, FalkorDB graph, named queries and agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "falkordb>=1.8.0",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "langchain-falkordb[langgraph]>=0.2.0",
    "langgraph>=1.2.15",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
brain = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = []

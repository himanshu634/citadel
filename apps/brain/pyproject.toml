[project]
name = "brain"
version = "0.1.0"
description = "Company Brain engine: adapters, ingestion, the FalkorDB graph and its named query tools."
requires-python = ">=3.12,<3.13"
dependencies = [
    "falkordb>=1.8.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "redis>=7",
    "rich>=14",
    "typer>=0.27.3",
]

[project.scripts]
brain = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

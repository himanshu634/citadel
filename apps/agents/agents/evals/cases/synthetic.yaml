# Golden cases for brain_synthetic (`make synthetic` loads it). The data and the answers it is
# built to give are described in examples/synthetic_company/generate.py.
#
# Schema: evals/cases.py. A uid is a literal string or a gold ref
#   {tool: <name>, params: {...}, field: <row field>, top: <n>}
# read from the graph when the run starts. Prefer gold refs for "the right answer" and literals
# for "must never be cited" (a bot, a made-up node).

# --- experts and ownership ------------------------------------------------------------------

- id: auth-expert
  tags: [experts]
  why: alice wrote most Auth changes and her team owns it; owners and experts agree.
  turns:
    - question: Who knows the Auth code best?
      expect:
        cite_any: [{tool: experts_for_system, params: {system: Auth}, field: person_uid}]
        tools_any: [experts_for_system, person_profile]
        text_all: [alice]
        max_steps: 6

- id: billing-reviewer
  tags: [experts]
  why: bob is the top Billing expert (erin is close behind); either is a fair pick, a third person isn't.
  turns:
    - question: Who should review a change to the billing service?
      expect:
        cite_any: [{tool: experts_for_system, params: {system: Billing}, field: person_uid, top: 2}]
        tools_any: [experts_for_system]
        text_any: [bob, erin]
        max_steps: 6

- id: infra-expert-not-bot
  tags: [experts, bots]
  why: ci-bot has more Infra commits than dave, but bots don't count as experts.
  turns:
    - question: Who is the go-to person for Infra?
      expect:
        cite_any: [{tool: experts_for_system, params: {system: Infra}, field: person_uid}]
        cite_none: [person:ci-bot]
        text_all: [dave]
        text_none: [ci-bot]
        max_steps: 6

- id: web-owners-vs-experts
  tags: [ownership]
  why: identity owns web/ in CODEOWNERS, but erin (payments) makes most Web app changes.
  turns:
    - question: Is the team that owns the Web app the one actually doing the work there?
      expect:
        cite_any: [person:erin, {tool: owners_vs_experts, field: system_uid}]
        tools_any: [owners_vs_experts, experts_for_system]
        text_all: [erin, identity]
        max_steps: 8

# --- impact and history ---------------------------------------------------------------------

- id: billing-impact
  tags: [impact]
  why: Billing and Web app change together most often, so Web app is the first thing at risk.
  turns:
    - question: If we change the billing service, what other parts of the code are likely affected?
      expect:
        cite_any: [{tool: impact_of, params: {system: Billing}, field: system_uid}]
        tools_any: [impact_of]
        text_all: [web]
        max_steps: 6

- id: jwt-why-and-who
  tags: [falkordb, fulltext, history, why]
  why: PR 1 (alice) replaced sessions with JWTs because the session table loaded the DB (issue 11).
  turns:
    - question: Why did we switch sessions to JWT, and who did it?
      expect:
        cite_any: [synthetic:pr:1, synthetic:issue:11, "synthetic:doc:docs/auth-design.md"]
        text_all: [alice]
        text_any: [load, cpu, session table]
        max_steps: 8

- id: duplicate-invoices
  tags: [falkordb, fulltext, history, why]
  why: issue 14 is open; the runbook and bob's comment point at the batch job's retry (PR 4).
  turns:
    - question: Why are invoice emails sometimes sent twice?
      expect:
        cite_any: [synthetic:issue:14, synthetic:pr:4, "synthetic:doc:docs/billing-runbook.md"]
        text_any: [retry, batch, idempot]
        max_steps: 8

- id: managed-postgres-decision
  tags: [history, decisions]
  why: ADR-001 and PR 8 (dave) moved to managed Postgres because self-hosted backups failed.
  turns:
    - question: Why did we move to managed Postgres?
      expect:
        cite_any: [synthetic:pr:8, "synthetic:doc:docs/adr/001-managed-postgres.md"]
        text_any: [backup]
        max_steps: 6

- id: checkout-ownership-open
  tags: [history, decisions]
  why: a Slack thread proposes moving checkout to payments, but no decision was made.
  turns:
    - question: Has anyone proposed changing who owns the checkout page? Was it decided?
      expect:
        cite_any: ["synthetic:slack:thread:eng-2026-07-15"]
        text_re: "\\b(no decision|not (yet )?(been )?decided|undecided|still open|open question|no final|not been made|hasn't been made|has not been made)\\b"
        max_steps: 8

# --- loose naming ---------------------------------------------------------------------------

- id: login-code-loose-name
  tags: [naming]
  why: '"the login code" is not a System name; it should be mapped to Auth before asking for experts.'
  turns:
    - question: Who knows the login code?
      expect:
        cite_any: [{tool: experts_for_system, params: {system: Auth}, field: person_uid}, person:erin]
        tools_any: [list_systems, experts_for_system, related_work_items]
        max_steps: 8

# --- abstention -----------------------------------------------------------------------------
# An explicit "not found", not just any negation ("alice owns it, not bob" must not pass).


- id: no-such-system
  tags: [abstain]
  why: there is no mobile app in the graph; the answer must say so instead of guessing an owner.
  turns:
    - question: Who owns the iOS mobile app?
      expect:
        text_re: "((couldn't|could not|can't|cannot|did not|didn't) find|there (is|are) no|no (record|person|one|evidence|match|such|mention|information|data)|not (in|found in|present in) the (company |knowledge )?graph|graph (has no|doesn't (show|have|list)|does not (show|have|list)))"
        cite_none: [person:alice, person:bob, person:carol, person:dave, person:erin]
        max_steps: 6

- id: no-such-person
  tags: [abstain]
  why: nobody called zoe is in the graph.
  turns:
    - question: What has zoe been working on lately?
      expect:
        text_re: "((couldn't|could not|can't|cannot|did not|didn't) find|there (is|are) no|no (record|person|one|evidence|match|such|mention|information|data)|not (in|found in|present in) the (company |knowledge )?graph|graph (has no|doesn't (show|have|list)|does not (show|have|list)))"
        cite_none: [person:alice, person:bob, person:carol, person:dave, person:erin]
        max_steps: 5

# --- follow-ups in one thread ---------------------------------------------------------------

- id: checkout-follow-up
  tags: [thread]
  why: the follow-up says "she"; the thread must carry erin over from the first turn.
  turns:
    - question: Who built the new checkout page?
      expect:
        cite_any: [synthetic:pr:5, person:erin]
        text_all: [erin]
        max_steps: 6
    - question: What else has she worked on recently?
      expect:
        cite_any: [synthetic:pr:6, synthetic:pr:9, synthetic:issue:14, "synthetic:commit:e005", "synthetic:commit:e006", "synthetic:commit:e004"]
        tools_any: [person_profile, related_work_items, recent_work_items, get_entity, work_history]
        text_none: [alice wrote, bob wrote]
        max_steps: 6

# --- semantic search ------------------------------------------------------------------------
# Questions worded so they share no key words with the text that answers them, so full-text
# search can't find it: related_work_items and related_documents return none of the cited uids for
# these exact questions (full-text ORs every word, so avoid even "the"). Needs embeddings on
# (EMBEDDING_PROVIDER=fastembed) when the graph is built.

- id: semantic-login-state
  tags: [falkordb, vector, semantic]
  why: the question never says session, JWT, login or server; PR #1 and issue #11 say why sessions moved to JWTs.
  turns:
    - question: What drove dropping per-user records kept by our backend in favour of signed credentials?
      expect:
        cite_any: [synthetic:pr:1, synthetic:issue:11, "synthetic:doc:docs/auth-design.md"]
        tools_any: [semantic_search]
        text_any: [session table, sessions table, db load, database load]
        max_steps: 5

- id: semantic-overcharge
  tags: [falkordb, vector, semantic]
  why: the question never says month, upgrade, customer, charged, billing or plan; issue #12 and PR #3 (proration) explain it.
  turns:
    - question: Why did people owe a whole period's fee after moving to a higher tier midway through?
      expect:
        cite_any: [synthetic:issue:12, synthetic:pr:3]
        tools_any: [semantic_search]
        text_any: [prorat, full month]
        max_steps: 6

- id: semantic-own-database
  tags: [falkordb, vector, semantic]
  why: the question never says Postgres, managed or backups; PR #8 and ADR-001 give the reason.
  turns:
    - question: What went wrong that made us outsource running our relational data store to a vendor?
      expect:
        cite_any: [synthetic:pr:8, "synthetic:doc:docs/adr/001-managed-postgres.md"]
        tools_any: [semantic_search]
        text_any: [backup]
        max_steps: 5

# --- interview: the person offers to answer ----------------------------------------------------

- id: interview-asks
  tags: [interview]
  why: Asked for questions, the brain asks from its open gaps, not a menu of what it can answer; nothing is filed before the person replies.
  turns:
    - question: Ask me questions.
      expect:
        tools_all: [open_gaps]
        tools_none: [record_testimony]
        max_steps: 6

# --- FalkorDB features ----------------------------------------------------------------------
# One Ask question per graph algorithm or FalkorDB feature behind a tool, so `make eval
# CASE=falkordb` walks all of them (the full-text and vector cases above carry the tag too):
#   algo.SPpaths     path_between       algo.pageRank      central_nodes (System, WorkItem, Document)
#   algo.betweenness bottlenecks        variable-length    blocked_on, waiting_on (BLOCKS*1..3)
#   aggregation      collaborators, issues_by_system      chained algorithms   falkordb-chain

- id: sppaths-people
  tags: [falkordb, sppaths]
  why: carol and dave share no team; the shortest path runs through PR 1 (JWT), which both reviewed.
  turns:
    - question: How are Carol and Dave connected?
      expect:
        cite_any: [synthetic:pr:1]
        tools_any: [path_between]
        text_any: [jwt, "#1", "PR 1"]
        max_steps: 5

- id: sppaths-person-system
  tags: [falkordb, sppaths]
  why: dave owns Infra, and bob's invoice query index commit touched both Infra and Billing.
  turns:
    - question: What links Dave to the Billing system?
      expect:
        cite_any: [synthetic:commit:b005, system:Infra]
        tools_any: [path_between]
        text_all: [infra]
        max_steps: 5

- id: pagerank-systems
  tags: [falkordb, pagerank]
  why: Infra is the most central system by PageRank (every system's changes touch its files).
  turns:
    - question: Which system is the most central to the company, the one the most other things lead to?
      expect:
        cite_any: [{tool: central_nodes, params: {label: System}, field: uid}]
        tools_any: [central_nodes]
        text_all: [infra]
        max_steps: 4

- id: pagerank-work-items
  tags: [falkordb, pagerank]
  why: issues 11 (session table load) and 12 (overcharged on upgrades) rank highest among work items.
  turns:
    - question: Which PRs or issues are the most important hubs in our history?
      expect:
        cite_any: [{tool: central_nodes, params: {label: WorkItem}, field: uid, top: 2}]
        tools_any: [central_nodes]
        text_any: [session table, overcharged]
        max_steps: 4

- id: pagerank-documents
  tags: [falkordb, pagerank]
  why: central_nodes ranks Documents too; the top one comes from the graph, not a fixed answer.
  turns:
    - question: Which of our design docs is the most central one?
      expect:
        cite_any: [{tool: central_nodes, params: {label: Document}, field: uid}]
        tools_any: [central_nodes]
        max_steps: 4

- id: betweenness-all
  tags: [falkordb, betweenness]
  why: PR 9 (usage-based add-ons) sits on the most BLOCKS/CLOSES/MENTIONS chains between other work.
  turns:
    - question: What is the biggest bottleneck in our work, the item the most other work runs through?
      expect:
        cite_any: [{tool: bottlenecks, field: uid}]
        tools_any: [bottlenecks]
        text_any: [add-on, "#9", "PR 9"]
        max_steps: 4

- id: betweenness-open
  tags: [falkordb, betweenness]
  why: only open work counts; PR 9 and PAY-2 remain, the merged PRs 3 and 1 drop out.
  turns:
    - question: Which open tickets or PRs are holding up the most other work right now?
      expect:
        cite_any: [{tool: bottlenecks, params: {open_only: true}, field: uid, top: 2}]
        cite_none: [synthetic:pr:1, synthetic:pr:3]
        tools_any: [bottlenecks]
        text_any: [PAY-2, add-on]
        max_steps: 4

- id: blocked-on-two-hops
  tags: [falkordb, varlength]
  why: carol's IDN-2 waits on IDN-1 (alice) and PAY-2 (bob) directly, and on PAY-3 (erin) two BLOCKS hops away.
  turns:
    - question: What is Carol's work waiting on, and who has to move first?
      expect:
        cite_all: [synthetic:ticket:IDN-1, synthetic:ticket:PAY-3]
        tools_any: [blocked_on]
        text_all: [alice, bob, erin]
        max_steps: 5

- id: waiting-on-alice
  tags: [falkordb, varlength]
  why: alice's IDN-1 blocks carol's IDN-2 and erin's PAY-4.
  turns:
    - question: Whose work is stuck behind Alice?
      expect:
        cite_any: [synthetic:ticket:IDN-2, synthetic:ticket:PAY-4]
        tools_any: [waiting_on]
        text_all: [carol, erin]
        max_steps: 5

- id: collaborators-alice
  tags: [falkordb, aggregation]
  why: carol reviewed or was reviewed by alice three times, more than anyone else.
  turns:
    - question: Who works most closely with Alice?
      expect:
        cite_any: [person:carol]
        tools_any: [collaborators]
        text_all: [carol]
        max_steps: 4

- id: issues-per-system
  tags: [falkordb, aggregation]
  why: Web app has the most issues (three, all closed).
  turns:
    - question: Which part of the code has had the most issues?
      expect:
        cite_any: [{tool: issues_by_system, field: system_uid}]
        tools_any: [issues_by_system]
        text_all: [web]
        max_steps: 4

- id: falkordb-chain
  tags: [falkordb, betweenness, sppaths, thread]
  why: three algorithms in one thread - betweenness finds PR 9, its author is erin, SPpaths links erin to carol.
  turns:
    - question: What open work is the biggest bottleneck right now?
      expect:
        cite_any: [{tool: bottlenecks, params: {open_only: true}, field: uid}]
        tools_any: [bottlenecks]
        max_steps: 4
    - question: Who is working on it?
      expect:
        cite_any: [person:erin, synthetic:pr:9, synthetic:ticket:PAY-3]
        text_all: [erin]
        max_steps: 4
    - question: How is that person connected to Carol?
      expect:
        cite_any: [synthetic:pr:5, synthetic:pr:9]
        tools_any: [path_between]
        max_steps: 4

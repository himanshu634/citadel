[project]
name = "agents"
version = "0.1.0"
description = "Company Brain agents: the Claude loop that answers from the graph, the agent roles, the simulations and the evals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "brain",
    "falkordb>=1.8.0",
    "langchain-falkordb[langgraph]>=0.2.0",
    "langgraph>=1.2.15",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "redis>=7",
    "typer>=0.27.3",
]

[project.scripts]
agents = "agents.cli:app"

[tool.uv.sources]
brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

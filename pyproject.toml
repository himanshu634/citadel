[project]
name = "citadel"
version = "0.1.0"
description = "Company Brain monorepo root (uv workspace). Apps live under apps/."
requires-python = ">=3.12,<3.13"
dependencies = ["agents", "brain"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/agents", "apps/brain"]

[tool.uv.sources]
agents = { workspace = true }
brain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/brain/tests", "apps/agents/tests"]
pythonpath = ["apps/brain"]  # brain's API tests import `tests.api.conftest` by name
addopts = ["-p", "brain.testing"]  # shared FalkorDB fixtures, one per session for every package

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# The synthetic company with its tickets read from a real Linear workspace. Graph:
# brain_synthetic_linear. Fill the workspace first with `make linear-seed SLUG=synthetic_linear
# CONFIRM=1`. Set `workspace` to your own workspace's URL key (linear.app/<workspace>).
slug: synthetic_linear
name: Synthetic Co (Linear)
data_permission: synthetic
window:
  since: 2026-01-01
sources:
  - type: canonical_jsonl   # the base data only: no tickets folder, Linear provides the tickets
    path: apps/backend/examples/synthetic_company
  - type: linear
    workspace: synthetic-co
    teams: [IDN, PAY]
systems:
  rules:
    - { match: "services/auth/**",    system: "Auth" }
    - { match: "services/billing/**", system: "Billing" }
    - { match: "web/**",              system: "Web app" }
    - { match: "infra/**",            system: "Infra" }
  fallback: depth_1
  ignore: ["**/*.lock"]
people:
  bots: ["ci-bot"]
  aliases: {}

# A tiny fake company used for offline demos and tests. Graph: brain_synthetic.
slug: synthetic
name: Synthetic Co
data_permission: synthetic
window:
  since: 2026-01-01
sources:
  - type: canonical_jsonl
    path: apps/brain/examples/synthetic_company
  - type: canonical_jsonl
    path: apps/brain/examples/synthetic_company/tickets
systems:
  rules:
    - { match: "services/auth/**",    system: "Auth" }
    - { match: "services/billing/**", system: "Billing" }
    - { match: "web/**",              system: "Web app" }
    - { match: "infra/**",            system: "Infra" }
  fallback: depth_1
  ignore: ["**/*.lock"]
people:
  bots: ["ci-bot"]
  aliases: {}
# Outside sources the Ask agent may call through the MCP connector (agents/mcp.py). Optional;
# a change needs no rebuild. Anthropic connects to the server, so it must be public HTTPS.
# mcp_servers:
#   - name: handbook                          # cited as mcp:handbook/<tool>
#     url: https://handbook.example.com/mcp
#     token_env: HANDBOOK_MCP_TOKEN           # the env var (or .env key) holding the token
#     allowed_tools: [search_docs]            # omit to allow every tool the server lists

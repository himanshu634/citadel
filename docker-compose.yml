# Local FalkorDB for Company Brain.
# 6379 = Redis protocol (the Python client talks to this), 3000 = FalkorDB Browser UI.
# The named volume keeps graphs across `docker compose down`; `down -v` wipes them.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  falkordb_data:
